<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Design — Denva Beaubrun</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; color: #111; font-family: 'Inter', sans-serif; font-weight: 300; min-height: 100vh; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; flex-shrink: 0; padding: 48px 32px; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; }
    .sidebar-name { font-family: 'EB Garamond', serif; font-size: 22px; font-weight: 400; color: #111; text-decoration: none; display: block; margin-bottom: 48px; line-height: 1.3; }
    .sidebar-section { margin-bottom: 32px; }
    .sidebar-label { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: #111; margin-bottom: 12px; display: block; }
    .sidebar-links { display: flex; flex-direction: column; gap: 10px; }
    .sidebar-links a { font-size: 13px; color: #999; text-decoration: none; line-height: 1.4; transition: color 0.15s; }
    .sidebar-links a:hover { color: #111; }
    .sidebar-about { font-size: 12px; color: #999; line-height: 1.7; margin-bottom: 16px; }
    .sidebar-footer { position: absolute; bottom: 48px; left: 32px; }
    .sidebar-footer a { font-size: 13px; color: #999; text-decoration: none; display: block; margin-bottom: 6px; }
    .sidebar-footer a:hover { color: #111; }
    .main { margin-left: 220px; flex: 1; padding: 48px 48px 80px; border-left: 1px solid #f0f0f0; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 48px 32px; }
    .card { cursor: pointer; }
    .card-thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; margin-bottom: 14px; background: #f5f5f5; transition: opacity 0.2s; }
    .card-thumb.sq { aspect-ratio: 1; }
    .card:hover .card-thumb { opacity: 0.88; }
    .card-title { font-size: 15px; font-weight: 400; color: #111; margin-bottom: 3px; }
    .card-year { font-size: 13px; color: #999; }
    .back-top { text-align: center; padding: 60px 0 20px; font-size: 13px; color: #999; cursor: pointer; text-decoration: none; display: block; }
    .back-top:hover { color: #111; }
    .powered { text-align: center; padding: 0 0 40px; font-size: 12px; color: #ccc; }
    .modal-backdrop { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); overflow-y: auto; }
    .modal-backdrop.open { display: block; }
    .modal { max-width: 760px; margin: 80px auto; background: #fff; padding: 48px; position: relative; }
    .modal-close { position: absolute; top: 20px; right: 24px; background: none; border: none; cursor: pointer; font-size: 22px; color: #999; line-height: 1; }
    .modal-close:hover { color: #111; }
    .modal-title { font-size: 22px; font-weight: 400; color: #111; margin-bottom: 4px; }
    .modal-year { font-size: 13px; color: #999; margin-bottom: 28px; }
    .modal-img { width: 100%; display: block; margin-bottom: 28px; }
    .modal-rule { height: 1px; background: #f0f0f0; margin-bottom: 28px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px; }
    .modal-label { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: #999; margin-bottom: 6px; }
    .modal-body { font-size: 13px; line-height: 1.8; color: #444; font-weight: 300; }
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; position: relative; padding: 32px 24px 24px; border-bottom: 1px solid #f0f0f0; }
      .sidebar-footer { position: relative; bottom: auto; left: auto; margin-top: 24px; }
      .main { margin-left: 0; padding: 32px 24px; border-left: none; }
      .grid { grid-template-columns: 1fr; }
      .modal { margin: 0; padding: 32px 24px; }
      .modal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <a href="index.html" class="sidebar-name">Denva Beaubrun</a>

    <div class="sidebar-section">
      <span class="sidebar-label">PROJECTS</span>
      <div class="sidebar-links">
        <a href="#" onclick="openModal('solareclipse'); return false;">Solar Eclipse — Play Flyer</a>
      </div>
    </div>

   <div class="sidebar-section">
  <div class="sidebar-links">
    <a href="about.html">About</a>
  </div>
</div>

    <div class="sidebar-section">
      <span class="sidebar-label">WORK</span>
      <div class="sidebar-links">
        <a href="mailto:denvacbeaubrun@gmail.com">Contact</a>
      </div>
    </div>

    <div class="sidebar-footer">
      <a href="index.html">← Dev Portfolio</a>
    </div>
  </aside>

  <main class="main">
    <div class="grid">

      <div class="card" onclick="openModal('solareclipse')">
        <img src="images/solar-eclipse.jpg" class="card-thumb" style="object-position: center 8%;" alt="Solar Eclipse play flyer">
        <p class="card-title">Solar Eclipse — Play Flyer</p>
        <p class="card-year">2026</p>
      </div>

    </div>

    <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">↑ Back to Top</a>
    <p class="powered">Denva Beaubrun · Graphic Design Portfolio</p>
  </main>

</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalBtn()">×</button>
    <div id="modal-inner"></div>
  </div>
</div>

<script>
  const projects = {
    solareclipse: {
      title: 'Solar Eclipse — Play Flyer',
      year: '2026',
      img: 'images/solar-eclipse.jpg',
      role: 'Graphic design',
      tools: 'Adobe InDesign, Photoshop, Canva',
      about: 'A promotional cast flyer for Solar Eclipse, a new play by Ryan Skinner presented by Stageplays Theatre Company for two benefit performances in August 2026 at the Theater at St. Jean\'s in New York City. Credited as graphic designer on the production.',
      process: 'A glowing red eclipse over a starfield anchors the layout, with the title set in script type across the black disc. Below it, the cast, a short synopsis, and the performance and ticket details follow in a centered serif hierarchy so the key information reads quickly.'
    },
  };

  function openModal(id) {
    const p = projects[id];
    if (!p) return;
    document.getElementById('modal-inner').innerHTML = `
      <p class="modal-title">${p.title}</p>
      <p class="modal-year">${p.year}</p>
      <img src="${p.img}" class="modal-img" alt="${p.title}">
      <div class="modal-rule"></div>
      <div class="modal-grid">
        <div><p class="modal-label">ROLE</p><p class="modal-body">${p.role}</p></div>
        <div><p class="modal-label">TOOLS</p><p class="modal-body">${p.tools}</p></div>
        <div><p class="modal-label">ABOUT</p><p class="modal-body">${p.about}</p></div>
        <div><p class="modal-label">PROCESS</p><p class="modal-body">${p.process}</p></div>
      </div>
    `;
    document.getElementById('modal-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal-backdrop')) {
      document.getElementById('modal-backdrop').classList.remove('open');
      document.body.style.overflow = '';
    }
  }

  function closeModalBtn() {
    document.getElementById('modal-backdrop').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('modal-backdrop').classList.remove('open');
      document.body.style.overflow = '';
    }
  });
</script>

</body>
</html>
